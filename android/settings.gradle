pluginManagement {
    includeBuild("../node_modules/@react-native/gradle-plugin")
    resolutionStrategy {
        eachPlugin {
            if (requested.id.id == "com.android.application" || requested.id.id == "com.android.library" || requested.id.id == "com.android.test") {
                useModule("com.android.tools.build:gradle:8.2.2")
            }
        }
    }
}

plugins {
    id("com.facebook.react.settings")
}

extensions.configure(com.facebook.react.ReactSettingsExtension) { ex -> 
    ex.autolinkLibrariesFromCommand() 
}

rootProject.name = 'mobile-meta-hub-template'
include ':app'

gradle.beforeProject { project ->
    project.buildscript.configurations.all {
        resolutionStrategy.force("com.android.tools.build:gradle:8.2.2")
    }
}
