pluginManagement {
    includeBuild("../node_modules/@react-native/gradle-plugin") {
        dependencySubstitution {
            substitute(module("com.android.tools.build:gradle"))
                .using(module("com.android.tools.build:gradle:8.7.2"))
        }
    }
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id("com.facebook.react.settings")
}

extensions.configure(com.facebook.react.ReactSettingsExtension) { ex -> 
    ex.autolinkLibrariesFromCommand() 
}

rootProject.name = 'mobile-meta-hub-template'
include ':app'
