pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

// Intercept buildscript classpath resolution across all projects AND included builds
gradle.settingsEvaluated {
    includeBuild("../node_modules/@react-native/gradle-plugin")
}

plugins {
    id("com.facebook.react.settings")
}

extensions.configure(com.facebook.react.ReactSettingsExtension) { ex -> 
    ex.autolinkLibrariesFromCommand() 
}

rootProject.name = 'mobile-meta-hub-template'
include ':app'

// Force AGP 8.7.2 across ALL buildscripts before project evaluation begins
gradle.allprojects { proj ->
    proj.buildscript {
        configurations.all {
            resolutionStrategy {
                force("com.android.tools.build:gradle:8.7.2")
                eachDependency { details ->
                    if (details.requested.group == "com.android.tools.build") {
                        details.useVersion("8.7.2")
                    }
                }
            }
        }
    }
}
