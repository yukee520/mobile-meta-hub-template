apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"

project.ext.react = [
    enableHermes: true
]

android {
    ndkVersion "23.1.7779620"
    compileSdkVersion 33
    buildToolsVersion "33.0.0"
    namespace "com.mobilemetahub"

    defaultConfig {
        applicationId "com.mobilemetahub"
        minSdkVersion 21
        targetSdkVersion 33
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    implementation("com.facebook.react:react-android:0.72.6")
    implementation("com.facebook.react:hermes-android:0.72.6")
}

// Dynamically resolve CLI autolinking path via Node.js
def reactNativeCliGradleScript = ["node", "-e", "console.log(require.resolve('@react-native-community/cli-platform-android/package.json'))"].execute([], project.rootDir).text.trim()
if (reactNativeCliGradleScript) {
    def cliDir = new File(reactNativeCliGradleScript).parentFile
    def nativeModulesScript = new File(cliDir, "native_modules.gradle")
    if (nativeModulesScript.exists()) {
        apply from: nativeModulesScript
        applyNativeModulesAppBuildGradle(project)
    }
}
