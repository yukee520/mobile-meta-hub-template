apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"

project.ext.react = [
    enableHermes: true
]

def rawAppName = project.hasProperty("APP_NAME") ? project.getProperty("APP_NAME") : "MobileMetaHub"
def sanitizedPkgName = rawAppName.toLowerCase().replaceAll("[^a-z0-9]", "")
if (sanitizedPkgName.isEmpty()) { sanitizedPkgName = "mobilemetahub" }
def dynamicApplicationId = "com.${sanitizedPkgName}.app"

android {
    ndkVersion "23.1.7779620"
    compileSdkVersion 33
    buildToolsVersion "33.0.0"
    
    // Fixed namespace keeps generated R & BuildConfig classes in com.mobilemetahub
    namespace "com.mobilemetahub"

    defaultConfig {
        // Unique applicationId creates a completely distinct app on the phone
        applicationId dynamicApplicationId
        minSdkVersion 21
        targetSdkVersion 33
        versionCode 1
        versionName "1.0"

        resValue "string", "app_name", rawAppName

        buildConfigField "boolean", "IS_NEW_ARCHITECTURE_ENABLED", "false"
        buildConfigField "boolean", "IS_HERMES_ENABLED", "true"
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            outputFileName = "${rawAppName}-${variant.buildType.name}.apk"
        }
    }
}

dependencies {
    implementation("com.facebook.react:react-android:0.72.6")
    implementation("com.facebook.react:hermes-android:0.72.6")
    implementation("com.facebook.soloader:soloader:0.10.5")
}

def autoLinkScript = new File(projectDir, "../node_modules/@react-native-community/cli-platform-android/native_modules.gradle")
if (!autoLinkScript.exists()) {
    autoLinkScript = new File(projectDir, "../../node_modules/@react-native-community/cli-platform-android/native_modules.gradle")
}
if (autoLinkScript.exists()) {
    apply from: autoLinkScript
    applyNativeModulesAppBuildGradle(project)
}
