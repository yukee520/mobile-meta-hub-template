apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"

project.ext.react = [
    enableHermes: true
]

android {
    ndkVersion "23.1.7779620"
    compileSdkVersion 33
    buildToolsVersion "33.0.0"
    namespace "com.mobilemetahub"

    defaultConfig {
        applicationId "com.mobilemetahub"
        minSdkVersion 21
        targetSdkVersion 33
        versionCode 1
        versionName "1.0"
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    implementation("com.facebook.react:react-android:0.72.6")
    implementation("com.facebook.react:hermes-android:0.72.6")
    implementation("com.facebook.soloader:soloader:0.10.5")
}

// Execute Native Modules Autolinking
def autoLinkScript = new File(projectDir, "../node_modules/@react-native-community/cli-platform-android/native_modules.gradle")
if (!autoLinkScript.exists()) {
    autoLinkScript = new File(projectDir, "../../node_modules/@react-native-community/cli-platform-android/native_modules.gradle")
}
if (autoLinkScript.exists()) {
    apply from: autoLinkScript
    applyNativeModulesAppBuildGradle(project)
}
