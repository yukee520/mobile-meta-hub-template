name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      app_name:
        description: 'Custom App Name (Optional override)'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Rename App Dynamically
        run: |
          RAW_NAME="${{ github.event.inputs.app_name || github.event.repository.name }}"
          CLEAN_NAME=$(echo "$RAW_NAME" | sed 's/[^a-zA-Z0-9]//g')
          LOWER_NAME=$(echo "$CLEAN_NAME" | tr '[:upper:]' '[:lower:]')

          echo "Renaming app to: $CLEAN_NAME with bundle ID: com.mobilemetahub.$LOWER_NAME"
          npx react-native-rename "$CLEAN_NAME" -b "com.mobilemetahub.$LOWER_NAME"

      - name: Setup Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Clean & Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew clean
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
