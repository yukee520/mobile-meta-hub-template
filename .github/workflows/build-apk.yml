name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install Dependencies
      run: npm install

    - name: Prepare Dynamic App Identity
      run: |
        RAW_NAME="${{ github.event.repository.name }}"
        APP_NAME="$RAW_NAME"
        CLEAN_PKG=$(echo "$RAW_NAME" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]//g')
        PACKAGE_NAME="com.${CLEAN_PKG}.app"

        echo "Rebranding all native and JS layers dynamically to: '$APP_NAME'"

        # 1. Dynamically update app.json (index.js imports the component name from here)
        if [ -f app.json ]; then
          npx jq ".name=\"$APP_NAME\" | .displayName=\"$APP_NAME\"" app.json > tmp.json && mv tmp.json app.json
        fi

        # 2. Update Launcher Display Name in Android Resources
        STRINGS_FILE="android/app/src/main/res/values/strings.xml"
        if [ -f "$STRINGS_FILE" ]; then
          sed -i "s/<string name=\"app_name\">.*<\/string>/<string name=\"app_name\">$APP_NAME<\/string>/" "$STRINGS_FILE"
        fi

        # 3. Update Android Application ID in build.gradle
        GRADLE_FILE="android/app/build.gradle"
        if [ -f "$GRADLE_FILE" ]; then
          sed -i "s/applicationId \".*\"/applicationId \"$PACKAGE_NAME\"/" "$GRADLE_FILE"
        fi

        # 4. Sync MainActivity.kt / MainActivity.java component registration name
        MAIN_ACT_KT=$(find android/app/src/main/java -name "MainActivity.kt" 2>/dev/null)
        MAIN_ACT_JAVA=$(find android/app/src/main/java -name "MainActivity.java" 2>/dev/null)

        if [ -n "$MAIN_ACT_KT" ]; then
          sed -i -E "s/getMainComponentName\(\): String(\?)? = \".*\"/getMainComponentName(): String\1 = \"$APP_NAME\"/" "$MAIN_ACT_KT"
        fi

        if [ -n "$MAIN_ACT_JAVA" ]; then
          sed -i -E "s/getMainComponentName\(\) \{ return \".*\"; \}/getMainComponentName() { return \"$APP_NAME\"; }/" "$MAIN_ACT_JAVA"
        fi

    - name: Make Gradle executable
      run: chmod +x android/gradlew

    - name: Build Android Release APK
      run: |
        cd android
        ./gradlew assembleRelease --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ github.event.repository.name }}-APK
        path: android/app/build/outputs/apk/release/*.apk
