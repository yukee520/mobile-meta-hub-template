name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Rebrand APK Metadata Dynamically
        run: |
          RAW_NAME="${{ github.event.repository.name }}"
          APP_NAME="$RAW_NAME"
          CLEAN_PKG=$(echo "$RAW_NAME" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]//g')
          PACKAGE_NAME="com.${CLEAN_PKG}.app"

          STRINGS_FILE="android/app/src/main/res/values/strings.xml"
          if [ -f "$STRINGS_FILE" ]; then
            sed -i "s/<string name=\"app_name\">.*<\/string>/<string name=\"app_name\">$APP_NAME<\/string>/" "$STRINGS_FILE"
          fi

          GRADLE_FILE="android/app/build.gradle"
          if [ -f "$GRADLE_FILE" ]; then
            sed -i "s/applicationId \".*\"/applicationId \"$PACKAGE_NAME\"/" "$GRADLE_FILE"
          fi

      - name: Fix Codegen Target Duplication
        run: |
          # Restore CMakeLists.txt clean state in node_modules if modified
          git checkout -- node_modules/react-native-safe-area-context/ 2>/dev/null || true

          # Provide include paths to app CMakeLists so autolinked target finds codegen headers
          APP_CMAKE="android/app/src/main/jni/CMakeLists.txt"
          if [ -f "$APP_CMAKE" ]; then
            echo 'target_include_directories(appmodules PRIVATE "${REACT_ANDROID_DIR}/../react-native-safe-area-context/common/cpp")' >> "$APP_CMAKE"
          fi

          # Disable safe-area-context CMake inclusion from root gradle to prevent dual target generation
          SETTINGS_FILE="android/settings.gradle"
          if [ -f "$SETTINGS_FILE" ]; then
            sed -i '/react-native-safe-area-context.*CMakeLists.txt/d' "$SETTINGS_FILE"
          fi

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build Release APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-APK
          path: android/app/build/outputs/apk/release/*.apk
