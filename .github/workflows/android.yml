name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Rebrand APK Metadata Dynamically
        run: |
          RAW_NAME="${{ github.event.repository.name }}"
          APP_NAME="$RAW_NAME"
          CLEAN_PKG=$(echo "$RAW_NAME" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]//g')
          PACKAGE_NAME="com.${CLEAN_PKG}.app"

          STRINGS_FILE="android/app/src/main/res/values/strings.xml"
          if [ -f "$STRINGS_FILE" ]; then
            sed -i "s/<string name=\"app_name\">.*<\/string>/<string name=\"app_name\">$APP_NAME<\/string>/" "$STRINGS_FILE"
          fi

          GRADLE_FILE="android/app/build.gradle"
          if [ -f "$GRADLE_FILE" ]; then
            sed -i "s/applicationId \".*\"/applicationId \"$PACKAGE_NAME\"/" "$GRADLE_FILE"
          fi

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Pre-generate Codegen and Bridge Header Directories
        run: |
          cd android
          # 1. Force Gradle to generate the codegen files first
          ./gradlew generateCodegenArtifactsFromSchema --no-daemon || true

          # 2. Define source and destination header paths
          SRC_JNI="app/build/generated/source/codegen/jni"
          DEST_SAFE="../node_modules/react-native-safe-area-context/android/build/generated/source/codegen/jni"

          # 3. Create missing target folders
          mkdir -p "$SRC_JNI"
          mkdir -p "$DEST_SAFE"

          # 4. Mirror generated headers to where safe-area-context expects them
          if [ -d "$SRC_JNI" ]; then
            cp -r "$SRC_JNI"/* "$DEST_SAFE"/ || true
          fi

      - name: Build Release APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-APK
          path: android/app/build/outputs/apk/release/*.apk
