name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Rebrand APK Metadata Dynamically
        run: |
          RAW_NAME="${{ github.event.repository.name }}"
          APP_NAME="$RAW_NAME"
          CLEAN_PKG=$(echo "$RAW_NAME" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]//g')
          PACKAGE_NAME="com.${CLEAN_PKG}.app"

          STRINGS_FILE="android/app/src/main/res/values/strings.xml"
          if [ -f "$STRINGS_FILE" ]; then
            sed -i "s/<string name=\"app_name\">.*<\/string>/<string name=\"app_name\">$APP_NAME<\/string>/" "$STRINGS_FILE"
          fi

          GRADLE_FILE="android/app/build.gradle"
          if [ -f "$GRADLE_FILE" ]; then
            sed -i "s/applicationId \".*\"/applicationId \"$PACKAGE_NAME\"/" "$GRADLE_FILE"
          fi

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Pre-generate Codegen & Patch Header Paths
        run: |
          cd android
          # 1. Force full app codegen run to generate all C++ headers
          ./gradlew :app:generateCodegenArtifactsFromSchema --no-daemon

          # 2. Patch safe-area-context CMakeLists to point directly to app codegen output
          SAFE_CMAKE="../node_modules/react-native-safe-area-context/android/src/main/jni/CMakeLists.txt"
          if [ -f "$SAFE_CMAKE" ]; then
            sed -i 's|${CMAKE_CURRENT_SOURCE_DIR}/../../../build/generated/source/codegen/jni|${PROJECT_ROOT_DIR}/app/build/generated/source/codegen/jni|g' "$SAFE_CMAKE"
          fi

          # 3. Mirror generated headers to safe-area-context fallback paths
          TARGET_DIR="../node_modules/react-native-safe-area-context/build/generated/source/codegen/jni"
          mkdir -p "$TARGET_DIR"
          if [ -d "app/build/generated/source/codegen/jni" ]; then
            cp -r app/build/generated/source/codegen/jni/* "$TARGET_DIR"/
          fi

      - name: Build Release APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-APK
          path: android/app/build/outputs/apk/release/*.apk
